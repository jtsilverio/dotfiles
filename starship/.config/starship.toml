"$schema" = 'https://starship.rs/config-schema.json'
follow_symlinks = false
add_newline = false
scan_timeout = 100
command_timeout = 500

format = """$directory\
$git_branch\
${custom.git_worktree}\
$git_status\
$line_break\
$character\
"""
right_format = """${custom.python_ver}$package"""

[directory]
format = "[ $path ]($style)"
truncation_length = 4
read_only = " 󰌾"

[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[>](bold fg:green)"
error_symbol = "[x](bold fg:red)"
vimcmd_symbol = "[:](bold fg:yellow)"

[package]
disabled = false
symbol = "󰏗 "
format = "[󰏗 $version]($style) "

[git_branch]
symbol = " "
format =  "[$symbol$branch]($style)"

[git_status]
format = "[$untracked$staged$modified$renamed$conflicted$ahead_behind ]($style)"
# options available for format
staged     = "[+](green)"
modified   = "[!](yellow)"
renamed    = "[»](blue)"
deleted    = "[-](red)"
untracked  = "[?](red)"
stashed    = "[≡](lavender)"
conflicted = "[x](red bold)"

ahead      = "[>${count}](teal)"
behind     = "[<${count}](peach)"
diverged   = "[<> >${ahead_count} <${behind_count}](mauve)"


[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓ "
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = " ([$output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

